#
# Purpose: prove out the build -> push -> deploy pipeline mechanics now,
# against a DevOps-authored placeholder backend/Dockerfile (see that file's
# header), before Backend Dev's real FastAPI app exists.
#
# Resource names below follow the "${var.project}-api-${var.env}" convention
# documented in infra/CLAUDE.md (ECR repo + Lambda function both use this
# exact pattern, with var.project defaulting to "swarasa" and
# var.env = "dev" per root CLAUDE.md "Environments"). Infra is provisioning
# the real resources in a PARALLEL task and hasn't produced actual Terraform
# output yet — these names are ASSUMED from the documented convention, not
# confirmed against real output. They must match exactly (repo name, Lambda
# function name, and the OIDC role ARN behind DEV_DEPLOY_ROLE_ARN) before
# this workflow can run for the first time. See this task's report for the
# full list of what's assumed vs. confirmed.
# ============================================================================

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

permissions:
  id-token: write   # required for OIDC — no static AWS keys, ever
  contents: read

env:
  AWS_REGION: us-east-1                          # confirmed — see DECISIONS.md "Region"
  ECR_REPOSITORY: swarasa-api-dev    # ASSUMED — see header comment above
  LAMBDA_FUNCTION_NAME: swarasa-api-dev  # ASSUMED — see header comment above

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role assumption, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # ASSUMED secret name (matches the convention already documented in
          # devops/CLAUDE.md's own draft example). The role itself doesn't
          # exist yet — Infra provisions it as a parallel task. A human must
          # create this GitHub secret with the real role ARN once that role
          # is applied, before this workflow's first real run.
          role-to-assume: ${{ secrets.DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Idempotency guard (devops/CLAUDE.md ALWAYS: "make the deploy step
      # idempotent — re-running the same workflow twice should be safe").
      # Infra's ECR module sets image_tag_mutability = "IMMUTABLE", so
      # re-pushing the same commit-SHA tag on a re-run would fail outright —
      # skip build/push if this tag was already pushed by an earlier run.
      - name: Check whether this commit's image was already pushed
        id: check-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image (tagged with commit SHA, never :latest)
        if: steps.check-image.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" backend/
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # devops/CLAUDE.md ALWAYS: "scan images on push ... and stop the
      # pipeline on critical findings". Infra's ECR module sets
      # scan_on_push = true; this just waits for and enforces the result.
      - name: Wait for image scan, stop on critical findings
        if: steps.check-image.outputs.exists == 'false'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG"
          CRITICAL=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
            --output text)
          if [ "$CRITICAL" != "None" ] && [ "$CRITICAL" -gt 0 ] 2>/dev/null; then
            echo "::error::$CRITICAL critical vulnerability finding(s) in image — aborting deploy."
            exit 1
          fi

      - name: Point Lambda at the new image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Wait for the update to finish applying
        run: |
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"
