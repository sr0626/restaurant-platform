[alembic]
script_location = %(here)s
prepend_sys_path = . ..

# Timezone for migration file timestamps.
timezone = UTC

# No hardcoded connection string here (root CLAUDE.md "NEVER hardcode
# secrets, keys, tokens, or passwords in any file"). env.py builds the
# URL from the DATABASE_URL environment variable instead — see env.py.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
